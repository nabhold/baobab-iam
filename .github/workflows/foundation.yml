# ==============================================================================
# Nabhold Engine Template
# Foundation Repository Gates (CONDITIONAL - needs application code)
#
# File: .github/workflows/foundation.yml.example
#
# Per TEMPLATE-USAGE.md step 3: rename to foundation.yml (dropping
# `.example`) once this engine has real application code. Set `dockerfile`
# to "" below if this engine doesn't build a container image yet - the
# reusable workflow's default assumes a Dockerfile exists at the repo root.
# Re-verify the pin below is still current before relying on it (check
# nabhold/shared's tags for a release newer than v1.3.0).
# ==============================================================================

name: Foundation Repository Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    # Bumped from v1.2.0 -> v1.3.0 (SHA is the annotated tag's peeled
    # commit, not the tag object's own SHA -- verified via the GitHub API's
    # git/tags/{sha} endpoint against nabhold/shared on 2026-09-10).
    # v1.2.0's repository-contract job compared minimum_version with
    # minimum.start_with?(baseline[:minimum]), a literal string-prefix
    # test that rejects any legitimately newer minimum_version (e.g.
    # "1.3.0" against the "full" profile's "1.2.6" floor) -- exactly this
    # repository's situation, and why that job had been failing outright.
    # v1.3.0 fixes this with a real Gem::Version >= comparison (see
    # nabhold/shared commits 6307d9e and 919ee0a).
    uses: nabhold/shared/.github/workflows/foundation-repository-gates.yml@c0b1dfcb5049f4e994e926a6f1ea9ff2b4a02b6c # v1.3.0
    with:
      # TODO: set to "" if this engine does not build a container image.
      dockerfile: "Dockerfile"
      build_context: "."
      # false until this repository's own Dependency graph (Settings ->
      # Security -> Code security -> Dependency graph) is actually enabled
      # -- the reusable workflow's own input description says to enable
      # this "only after" that precondition is met, but it was flipped to
      # true here prematurely, which is why `foundation / dependency-review.`
      # has been failing ("Dependency graph not enabled in repo Settings").
      # Flip back to true once an org admin turns it on for this repo.
      dependency_review_enabled: true

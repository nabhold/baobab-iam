name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  foundation:
    # Use the reusable Foundation gate from nabhold/shared
    uses: nabhold/shared/.github/workflows/foundation-gates.yml@<SHA> # v1.x.x
    with:
      environment: development
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: foundation
    steps:
      - uses: actions/checkout@<SHA> # v4.x.x
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@<SHA> # v3.x.x
      - name: Build image
        uses: docker/build-push-action@<SHA> # v5.x.x
        with:
          context: .
          push: false
          load: true
          tags: baobab-iam:test
      - name: Run container and test health
        run: |
          docker run -d --name test-iam -p 8080:8080 baobab-iam:test
          sleep 30
          curl -f http://localhost:8080/health/ready
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@<SHA> # v0.18.0
        with:
          image-ref: baobab-iam:test
          severity: CRITICAL,HIGH
          format: table